# render.yaml — Render.com deployment config for the Discord /scan command service
#
# This deploys discord_bot/server.py as a free-tier web service.
# Render auto-detects this file when you create a new Blueprint deploy,
# or you can configure these settings manually in the Render dashboard.
#
# IMPORTANT: Set these as SECRET environment variables in the Render
# dashboard (Settings > Environment) — do NOT commit actual values here:
#   DISCORD_PUBLIC_KEY
#   DISCORD_APPLICATION_ID
#   ANTHROPIC_API_KEY
#   GITHUB_TOKEN     — Personal Access Token with repo scope, needed by
#                      /status (read scan artifacts) and /watchlist
#                      (read/write the WATCHLIST repo variable)
#   GITHUB_REPO      — e.g. "xel0irg/stock-ai-bot" (defaults to that if unset)
#   (plus any other secrets analyze_ticker() needs — see config/settings.py)

services:
  - type: web
    name: stock-ai-bot-discord
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn discord_bot.server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"

  - type: web
    name: degenic-dashboard
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn dashboard_server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: GITHUB_REPO
        value: "xel0irg/stock-ai-bot"
      # Set GITHUB_TOKEN in Render dashboard → Environment (keep it secret)
      # Settings > Environment > Add Environment Variable
      # Key: GITHUB_TOKEN  Value: your GitHub PAT with repo scope
