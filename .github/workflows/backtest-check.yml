name: Stock AI Bot — Backtest Outcome Check

on:
  # PRIMARY TRIGGER: repository_dispatch, fired by an external scheduler
  # (cron-job.org) once daily before market open. The native schedule:
  # cron below is kept ONLY as a low-stakes backup — we've already
  # confirmed via scan.yml's run history that GitHub's own scheduler
  # drops the large majority of triggers and fires at unpredictable
  # times, sometimes not at all for days. A once-daily backtest check
  # tolerates that backup running late far better than the 30-min
  # trading scan does, but it should not be relied on alone either.
  repository_dispatch:
    types: [backtest-check-trigger]

  schedule:
    - cron: "30 12 * * 1-5"   # 8:30 AM ET (12:30 UTC during EDT) — backup only

  workflow_dispatch: {}

jobs:
  check-outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # needed to commit the updated CSV back to the repo
    concurrency:
      group: stock-ai-bot-backtest-check
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run outcome checker
        run: python -m backtest.outcome_checker --recheck

      - name: Generate backtest report
        run: python -m backtest.report

      - name: Commit updated signal log
        run: |
          git config user.name "Stock AI Bot"
          git config user.email "bot@stockaibot.dev"
          if [ -f backtest/signals_log.csv ]; then
            git add backtest/signals_log.csv
            git diff --staged --quiet || git commit -m "chore: update backtest outcomes [skip ci]"
            git pull --rebase --autostash || true
            git push
          else
            echo "backtest/signals_log.csv does not exist yet — no scans have committed any signals to check. Nothing to do."
          fi
