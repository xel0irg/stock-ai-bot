name: Stock AI Bot — Scheduled Scan

on:
  # PRIMARY TRIGGER: repository_dispatch, fired by an external scheduler
  # (cron-job.org) hitting GitHub's API every 30 min during market hours.
  #
  # The native `schedule:` cron trigger has been REMOVED. Keeping both
  # active caused two parallel workflow runs to fire ~90 seconds apart
  # (one from GitHub's schedule, one from cron-job.org), each scanning
  # the full watchlist independently and both posting to Discord —
  # which produced duplicate/interleaved alerts for every ticker.
  #
  # cron-job.org is now the single source of truth for scheduling.
  repository_dispatch:
    types: [scan-trigger]

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      ticker:
        description: "Specific ticker to analyze (leave blank for full watchlist)"
        required: false
        default: ""
      watchlist:
        description: "Custom watchlist (comma-separated, overrides .env)"
        required: false
        default: ""

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write   # needed to commit backtest/signals_log.csv back to the repo
    # With 5-min cron triggers and ~5-7 min scan runtimes, a new trigger
    # fires before the current scan finishes. cancel-in-progress: false
    # means the RUNNING scan completes and the QUEUED one is dropped —
    # the opposite of the old behavior which cancelled the running scan.
    concurrency:
      group: stock-ai-bot-scan
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env from secrets
        run: |
          cat > .env << EOF
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}
          TWITTER_BEARER_TOKEN=${{ secrets.TWITTER_BEARER_TOKEN }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          REDDIT_USER_AGENT=${{ secrets.REDDIT_USER_AGENT }}
          WATCHLIST=${{ vars.WATCHLIST || secrets.WATCHLIST }}
          CONFLUENCE_THRESHOLD=${{ secrets.CONFLUENCE_THRESHOLD }}
          DAILY_SPEND_LIMIT_USD=${{ secrets.DAILY_SPEND_LIMIT_USD }}
          SCAN_INTERVAL_MINUTES=30
          SENTIMENT_THRESHOLD=0.6
          LOG_LEVEL=INFO
          EOF

      - name: Run Stock AI Bot
        run: |
          if [ -n "${{ github.event.inputs.ticker }}" ]; then
            python main.py --ticker "${{ github.event.inputs.ticker }}"
          elif [ -n "${{ github.event.inputs.watchlist }}" ]; then
            python main.py --watchlist "${{ github.event.inputs.watchlist }}"
          else
            python main.py
          fi

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-reports-${{ github.run_number }}
          path: logs/
          retention-days: 30

      - name: Commit backtest signal log
        # Without this step, every signal generated by this run is lost
        # the moment the runner shuts down — backtest/signals_log.csv was
        # being created locally but never persisted back to the repo,
        # so the backtesting engine had zero data despite running daily.
        if: always()
        run: |
          git config user.name "Stock AI Bot"
          git config user.email "bot@stockaibot.dev"
          git add backtest/signals_log.csv backtest/prescreener_state.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update backtest log + prescreener state [skip ci]"
          git pull --rebase --autostash || true
          git push || true

      - name: Clean up .env
        if: always()
        run: rm -f .env