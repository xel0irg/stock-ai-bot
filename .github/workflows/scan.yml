name: Stock AI Bot — Scheduled Scan

on:
  # PRIMARY TRIGGER: repository_dispatch, fired by an external scheduler
  # (cron-job.org) hitting GitHub's API every 30 min during market hours.
  # GitHub's own `schedule:` cron below is kept as a best-effort backup,
  # but it is NOT reliable for sub-hourly triggers — GitHub explicitly
  # documents that schedules near peak load (incl. every :00/:30) are
  # frequently delayed or dropped entirely. In practice this caused the
  # bot to fire only ~once/day, at random times in the afternoon.
  repository_dispatch:
    types: [scan-trigger]

  # BACKUP ONLY — unreliable, do not depend on this for trading signals.
  # Kept so the bot still fires occasionally even if the external
  # scheduler is ever down.
  schedule:
    - cron: "7,37 13-19 * * 1-5"

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      ticker:
        description: "Specific ticker to analyze (leave blank for full watchlist)"
        required: false
        default: ""
      watchlist:
        description: "Custom watchlist (comma-separated, overrides .env)"
        required: false
        default: ""

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env from secrets
        run: |
          cat > .env << EOF
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}
          TWITTER_BEARER_TOKEN=${{ secrets.TWITTER_BEARER_TOKEN }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          REDDIT_USER_AGENT=${{ secrets.REDDIT_USER_AGENT }}
          WATCHLIST=${{ secrets.WATCHLIST }}
          CONFLUENCE_THRESHOLD=${{ secrets.CONFLUENCE_THRESHOLD }}
          SCAN_INTERVAL_MINUTES=30
          SENTIMENT_THRESHOLD=0.6
          LOG_LEVEL=INFO
          EOF

      - name: Run Stock AI Bot
        run: |
          if [ -n "${{ github.event.inputs.ticker }}" ]; then
            python main.py --ticker "${{ github.event.inputs.ticker }}"
          elif [ -n "${{ github.event.inputs.watchlist }}" ]; then
            python main.py --watchlist "${{ github.event.inputs.watchlist }}"
          else
            python main.py
          fi

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-reports-${{ github.run_number }}
          path: logs/
          retention-days: 30

      - name: Clean up .env
        if: always()
        run: rm -f .env