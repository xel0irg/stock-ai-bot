name: Stock AI Bot — Scheduled Scan

on:
  # Run every 30 minutes during market hours (Mon-Fri 9:30 AM - 3:30 PM ET = 13:30-19:30 UTC)
  # Offset to :07 and :37 instead of :00/:30 — GitHub Actions explicitly warns that
  # schedules on the hour/half-hour hit peak global load and are frequently delayed
  # or dropped. This was causing scans to silently skip all day and only fire once,
  # late, near market close. See: https://docs.github.com/actions/using-workflows/events-that-trigger-workflows#schedule
  schedule:
    - cron: "7,37 13-19 * * 1-5"

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      ticker:
        description: "Specific ticker to analyze (leave blank for full watchlist)"
        required: false
        default: ""
      watchlist:
        description: "Custom watchlist (comma-separated, overrides .env)"
        required: false
        default: ""

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env from secrets
        run: |
          cat > .env << EOF
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}
          TWITTER_BEARER_TOKEN=${{ secrets.TWITTER_BEARER_TOKEN }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          REDDIT_USER_AGENT=${{ secrets.REDDIT_USER_AGENT }}
          WATCHLIST=${{ secrets.WATCHLIST }}
          CONFLUENCE_THRESHOLD=${{ secrets.CONFLUENCE_THRESHOLD }}
          SCAN_INTERVAL_MINUTES=30
          SENTIMENT_THRESHOLD=0.6
          LOG_LEVEL=INFO
          EOF

      - name: Run Stock AI Bot
        run: |
          if [ -n "${{ github.event.inputs.ticker }}" ]; then
            python main.py --ticker "${{ github.event.inputs.ticker }}"
          elif [ -n "${{ github.event.inputs.watchlist }}" ]; then
            python main.py --watchlist "${{ github.event.inputs.watchlist }}"
          else
            python main.py
          fi

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-reports-${{ github.run_number }}
          path: logs/
          retention-days: 30

      - name: Clean up .env
        if: always()
        run: rm -f .env