<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock AI Bot</title>


<style>
:root {
  --bg:      #0d0d0d;
  --bg2:     #161616;
  --bg3:     #1e1e1e;
  --bg4:     #252525;
  --border:  rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text:    #efefef;
  --text2:   #888;
  --text3:   #444;
  --green:   #22c55e;
  --green2:  rgba(34,197,94,0.12);
  --red:     #ef4444;
  --red2:    rgba(239,68,68,0.12);
  --yellow:  #f59e0b;
  --yellow2: rgba(245,158,11,0.12);
  --sans: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --mono: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 13px; min-height: 100vh; -webkit-font-smoothing: antialiased; }

/* ── Topbar ── */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 28px; border-bottom: 1px solid var(--border);
  background: var(--bg); position: sticky; top: 0; z-index: 10;
}
.tb-left { display: flex; align-items: center; gap: 12px; }
.tb-title { font-size: 14px; font-weight: 600; letter-spacing: .03em; color: var(--text); }
.live-badge {
  display: flex; align-items: center; gap: 5px;
  font-family: var(--mono); font-size: 10px; font-weight: 500;
  color: var(--green); background: var(--green2);
  padding: 3px 9px; border-radius: 20px; letter-spacing: .04em;
}
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; flex-shrink: 0; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
.tb-right { display: flex; align-items: center; gap: 14px; }
.tb-meta { font-family: var(--mono); font-size: 10px; color: var(--text3); }
.tb-countdown { font-family: var(--mono); font-size: 10px; color: var(--text3); }
.refresh-btn {
  font-family: var(--mono); font-size: 11px; color: var(--text2);
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 6px; padding: 5px 12px; cursor: pointer;
  transition: color .15s, background .15s;
}
.refresh-btn:hover { color: var(--text); background: var(--bg4); }

/* ── Layout ── */
.main { padding: 24px 28px; max-width: 1120px; margin: 0 auto; }

/* ── Stat cards ── */
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 24px; }
.stat {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 10px; padding: 16px 18px;
}
.stat-label {
  font-family: var(--mono); font-size: 9px; font-weight: 500;
  color: var(--text3); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px;
}
.stat-value { font-size: 26px; font-weight: 600; color: var(--text); line-height: 1; margin-bottom: 5px; }
.stat-sub { font-family: var(--mono); font-size: 11px; color: var(--text2); }

/* ── Section label ── */
.sec-label {
  font-family: var(--mono); font-size: 9px; font-weight: 500;
  color: var(--text3); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 12px;
}

/* ── Signal cards ── */
.signal-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 12px; padding: 18px 20px; margin-bottom: 10px;
  position: relative; overflow: hidden;
}
.signal-card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
}
.signal-card.call::before { background: var(--green); }
.signal-card.put::before  { background: var(--red); }

.sc-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.sc-ticker-group { display: flex; align-items: baseline; gap: 10px; }
.sc-ticker { font-size: 20px; font-weight: 600; color: var(--text); }
.sc-price { font-family: var(--mono); font-size: 13px; color: var(--text2); }
.sc-chg { font-family: var(--mono); font-size: 11px; }
.sc-right { display: flex; align-items: center; gap: 8px; }
.sc-score-lbl { font-family: var(--mono); font-size: 12px; color: var(--text2); }

.badge {
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  padding: 4px 12px; border-radius: 20px; letter-spacing: .02em; white-space: nowrap;
}
.badge.call     { background: var(--green2); color: var(--green); }
.badge.put      { background: var(--red2);   color: var(--red);   }
.badge.moderate { background: var(--yellow2); color: var(--yellow); }
.badge.none     { background: var(--bg4);    color: var(--text3); }
.badge.hi       { background: var(--green2); color: var(--green); }
.badge.earnings { background: var(--yellow2); color: var(--yellow); }

/* ── Score bar ── */
.bar-wrap { margin-bottom: 16px; }
.bar-track { height: 3px; background: var(--bg4); border-radius: 2px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 2px; transition: width .5s ease; }

/* ── Fields grid ── */
.fields-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 14px; }
.field { background: var(--bg3); border-radius: 8px; padding: 9px 11px; }
.field-k {
  font-family: var(--mono); font-size: 8px; font-weight: 500;
  color: var(--text3); letter-spacing: .07em; text-transform: uppercase; margin-bottom: 4px;
}
.field-v { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--text); }

/* ── Footer conditions ── */
.sc-footer { border-top: 1px solid var(--border); padding-top: 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.sc-footer-item {}
.sc-footer-k { font-family: var(--mono); font-size: 8px; font-weight: 500; color: var(--text3); letter-spacing: .07em; text-transform: uppercase; margin-bottom: 4px; }
.sc-footer-v { font-size: 11px; color: var(--text2); line-height: 1.5; }

/* ── No trade rows ── */
.nt-list { display: flex; flex-direction: column; gap: 6px; }
.nt-row {
  background: var(--bg2); border: 1px solid var(--border); border-left: 2px solid var(--border2);
  border-radius: 10px; padding: 11px 18px;
  display: flex; align-items: center; justify-content: space-between;
}
.nt-left { display: flex; align-items: center; gap: 16px; }
.nt-ticker { font-size: 14px; font-weight: 600; color: var(--text); min-width: 52px; }
.nt-price { font-family: var(--mono); font-size: 12px; color: var(--text2); }
.nt-signals { display: flex; gap: 12px; }
.nt-sig { font-family: var(--mono); font-size: 11px; color: var(--text3); }
.nt-right { display: flex; align-items: center; gap: 10px; }
.mini-track { width: 52px; height: 3px; background: var(--bg4); border-radius: 2px; overflow: hidden; }
.mini-fill { height: 100%; border-radius: 2px; background: var(--text3); }
.nt-score { font-family: var(--mono); font-size: 11px; color: var(--text3); min-width: 46px; text-align: right; }

/* ── Colors ── */
.g { color: var(--green) !important; }
.r { color: var(--red)   !important; }
.y { color: var(--yellow)!important; }
.m { color: var(--text2) !important; }
.d { color: var(--text3) !important; }

/* ── Error banner ── */
.err {
  display: none; background: var(--red2); border: 1px solid var(--red);
  border-radius: 8px; padding: 10px 14px; margin-bottom: 18px;
  font-family: var(--mono); font-size: 11px; color: var(--red); line-height: 1.5;
}

/* ── Empty state ── */
.empty { text-align: center; padding: 60px 20px; color: var(--text3); }
.empty .icon { font-size: 36px; margin-bottom: 12px; }
.empty p { font-family: var(--mono); font-size: 12px; line-height: 1.8; }
.empty code { color: var(--text2); }

/* ── Section spacer ── */
.section-gap { margin-top: 28px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-left">
    <div class="live-badge"><div class="live-dot"></div>LIVE</div>
    <span class="tb-title">Stock AI Bot</span>
  </div>
  <div class="tb-right">
    <span class="tb-countdown" id="countdown">Refreshing in 5:00</span>
    <span class="tb-meta" id="data-source" style="color:#444"></span>
    <span class="tb-meta" id="last-scan"></span>
    <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
  </div>
</div>

<div class="main">
  <div class="err" id="err"></div>

  <div class="stat-grid">
    <div class="stat">
      <div class="stat-label">Signals Fired</div>
      <div class="stat-value" id="s-fired">—</div>
      <div class="stat-sub" id="s-fired-sub">loading...</div>
    </div>
    <div class="stat">
      <div class="stat-label">Top Conviction</div>
      <div class="stat-value" id="s-top">—</div>
      <div class="stat-sub" id="s-top-sub">loading...</div>
    </div>
    <div class="stat">
      <div class="stat-label">Avg Score</div>
      <div class="stat-value" id="s-avg">—</div>
      <div class="stat-sub" id="s-avg-sub">across watchlist</div>
    </div>
    <div class="stat">
      <div class="stat-label">No Trade</div>
      <div class="stat-value" id="s-none">—</div>
      <div class="stat-sub d">below threshold</div>
    </div>
  </div>

  <div class="sec-label">Active Setups</div>
  <div id="active-signals"></div>

  <div class="section-gap">
    <div class="sec-label">No Trade</div>
    <div class="nt-list" id="no-trade-list"></div>
  </div>
</div>

<script>
const API = 'http://localhost:7842';
let countdown = 300, timer;

const barColor = s => s >= 70 ? '#22c55e' : s >= 55 ? '#f59e0b' : '#333';
const fmtP = v => v != null ? '$' + parseFloat(v).toFixed(2) : '—';
const fmtChg = v => {
  if (v == null) return '';
  const s = v >= 0 ? '+' : '', c = v >= 0 ? 'g' : 'r';
  return `<span class="${c}">${s}${parseFloat(v).toFixed(2)}%</span>`;
};

async function loadData() {
  try {
    const res = await fetch(`${API}/latest`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const payload = await res.json();
    const data = Array.isArray(payload) ? payload : (payload.reports || []);
    const source = payload.source || 'local';
    document.getElementById('err').style.display = 'none';
    const srcEl = document.getElementById('data-source');
    if (srcEl) srcEl.textContent = source === 'github' ? '☁ GitHub' : '💻 Local';
    render(data);
  } catch(e) {
    const el = document.getElementById('err');
    el.style.display = 'block';
    el.textContent = `⚠  Cannot reach dashboard server — run: python dashboard_server.py   (${e.message})`;
  }
  resetTimer();
}

function render(reports) {
  if (!reports || !reports.length) {
    document.getElementById('active-signals').innerHTML =
      '<div class="empty"><div class="icon">📭</div><p>No scan reports found yet.<br>Run the bot: <code>python main.py</code></p></div>';
    document.getElementById('no-trade-list').innerHTML = '';
    updateStats([], []);
    return;
  }

  const active   = reports.filter(r => r.trade_setup?.contract_type && r.trade_setup.contract_type !== 'NONE');
  const noTrade  = reports.filter(r => !r.trade_setup?.contract_type || r.trade_setup.contract_type === 'NONE');
  active.sort((a,b)  => (b.confluence_score||0) - (a.confluence_score||0));
  noTrade.sort((a,b) => (b.confluence_score||0) - (a.confluence_score||0));

  updateStats(reports, active);

  document.getElementById('active-signals').innerHTML = active.length
    ? active.map(signalCard).join('')
    : '<p style="font-family:var(--mono);font-size:12px;color:var(--text3);padding:12px 0">No active setups this scan — scores below threshold.</p>';

  document.getElementById('no-trade-list').innerHTML = noTrade.map(ntRow).join('');

  const latest = reports.map(r=>r.timestamp).sort().pop();
  if (latest) {
    const d = new Date(latest);
    document.getElementById('last-scan').textContent =
      `Last scan ${d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} · ${reports.length} tickers`;
  }
}

function updateStats(reports, active) {
  const avg = reports.length ? Math.round(reports.reduce((s,r)=>(s+(r.confluence_score||0)),0)/reports.length) : 0;
  const top = [...reports].sort((a,b)=>(b.confluence_score||0)-(a.confluence_score||0))[0];

  document.getElementById('s-fired').textContent = active.length;
  document.getElementById('s-fired-sub').innerHTML = active.length
    ? active.map(r=>`<span class="${r.trade_setup.contract_type==='CALL'?'g':'r'}">${r.trade_setup.contract_type}</span>`).join(' + ')
    : '<span class="d">no signals</span>';

  if (top) {
    const ts = top.trade_setup || {};
    const sc = top.confluence_score || 0;
    document.getElementById('s-top').textContent = top.ticker;
    document.getElementById('s-top-sub').innerHTML =
      `<span class="${sc>=70?'g':sc>=55?'y':'d'}">${ts.contract_type||'NONE'} · ${sc}/100</span>`;
  }

  document.getElementById('s-avg').textContent = avg;
  document.getElementById('s-avg-sub').textContent = `across ${reports.length} ticker${reports.length!==1?'s':''}`;
  document.getElementById('s-none').textContent = reports.length - active.length;
}

function signalCard(r) {
  const ts   = r.trade_setup || {};
  const tech = r.technicals  || {};
  const ct   = ts.contract_type || 'NONE';
  const cls  = ct === 'CALL' ? 'call' : 'put';
  const sc   = r.confluence_score || 0;
  const qual = ts.setup_quality || '';
  const qBadge = qual.includes('HIGH') ? 'hi' : qual.includes('MODERATE') ? 'moderate' : 'none';

  return `<div class="signal-card ${cls}">
  <div class="sc-top">
    <div class="sc-ticker-group">
      <span class="sc-ticker">${r.ticker}</span>
      <span class="sc-price">${fmtP(tech.last_price)}</span>
      <span class="sc-chg">${fmtChg(tech.return_1d)}</span>
    </div>
    <div class="sc-right">
      <span class="sc-score-lbl">${sc}/100</span>
      <span class="badge ${qBadge}">${qual||'NO TRADE'}</span>
      <span class="badge ${cls}">${ct} · ${ts.expiry||'?'}</span>
    </div>
  </div>
  <div class="bar-wrap">
    <div class="bar-track"><div class="bar-fill" style="width:${sc}%;background:${barColor(sc)}"></div></div>
  </div>
  <div class="fields-grid">
    <div class="field"><div class="field-k">Strike</div><div class="field-v ${cls==='call'?'g':'r'}">${ts.strike?'$'+ts.strike:'—'}</div></div>
    <div class="field"><div class="field-k">Moneyness</div><div class="field-v m">${(ts.moneyness||'—').replace('SLIGHTLY_OTM','SL.OTM')}</div></div>
    <div class="field"><div class="field-k">Stock Target</div><div class="field-v ${cls==='call'?'g':'r'}">${ts.stock_target?'$'+ts.stock_target:'—'}</div></div>
    <div class="field"><div class="field-k">Premium</div><div class="field-v">${ts.est_premium?'$'+ts.est_premium:'—'}</div></div>
    <div class="field"><div class="field-k">Profit Target</div><div class="field-v g">${ts.profit_target?ts.profit_target+'%':'—'}</div></div>
    <div class="field"><div class="field-k">Max Loss</div><div class="field-v r">100%</div></div>
  </div>
  <div class="sc-footer">
    <div class="sc-footer-item"><div class="sc-footer-k">Enter When</div><div class="sc-footer-v">${ts.entry_condition||'—'}</div></div>
    <div class="sc-footer-item"><div class="sc-footer-k">Avoid If</div><div class="sc-footer-v">${ts.avoid_if||'—'}</div></div>
    <div class="sc-footer-item"><div class="sc-footer-k">Key Risk</div><div class="sc-footer-v">${ts.key_risk||'—'}</div></div>
  </div>
</div>`;
}

function ntRow(r) {
  const tech = r.technicals || {};
  const ts   = r.trade_setup || {};
  const sc   = r.confluence_score || 0;
  const earn = (ts.setup_quality||'').includes('EARNINGS');
  return `<div class="nt-row">
  <div class="nt-left">
    <span class="nt-ticker">${r.ticker}</span>
    <span class="nt-price">${fmtP(tech.last_price)} ${fmtChg(tech.return_1d)}</span>
    <div class="nt-signals">
      <span class="nt-sig">RSI ${tech.rsi?parseFloat(tech.rsi).toFixed(1):'—'}</span>
      <span class="nt-sig">MACD ${(tech.macd_crossover||'—').toUpperCase()}</span>
      <span class="nt-sig">VOL ${tech.volume_ratio?parseFloat(tech.volume_ratio).toFixed(1)+'x':'—'}</span>
    </div>
  </div>
  <div class="nt-right">
    <div class="mini-track"><div class="mini-fill" style="width:${sc}%"></div></div>
    <span class="nt-score">${sc}/100</span>
    <span class="badge ${earn?'earnings':'none'}">${earn?'⚡ EARNINGS':'NONE'}</span>
  </div>
</div>`;
}

function resetTimer() {
  countdown = 300; clearInterval(timer);
  timer = setInterval(()=>{
    countdown--;
    const m = Math.floor(countdown/60), s = countdown%60;
    document.getElementById('countdown').textContent = `Refreshing in ${m}:${s.toString().padStart(2,'0')}`;
    if (countdown <= 0) loadData();
  }, 1000);
}

loadData();
</script>
</body>
</html>
